# =============================================================================
# configs/mi6x/oc_balanced.conf
# Status: SOURCE VERIFIED, CROSS-BIN (GPU only) — RISK: LOW-MODERATE
# =============================================================================

DEVICE=mi6x
CODENAME=wayne
SOC=SDM660
DEFCONFIG_BASE=arch/arm64/configs/wayne_defconfig
DTS_TARGET=arch/arm/boot/dts/qcom/sdm660-mtp-wayne.dts

PROFILE=oc_balanced
ARTIFACT_NAME=kernel-mi6x-balanced-oc
RISK_LEVEL=LOW-MODERATE
REQUIRES_ACKNOWLEDGEMENT=true

# --- CPU: TIDAK DIUBAH ---
# Alasan (SOURCE VERIFIED): little cluster sudah di max source (1843.2MHz)
# untuk semua speed-bin selain bin3. Tidak ada headroom CPU yang tersedia
# tanpa cross-bin. Balanced OC sengaja tidak menyentuh CPU demi stabilitas.
CPU_OVERCLOCK=false
CPU_LITTLE_MAX_MHZ=stock
CPU_BIG_MAX_MHZ=stock
CPU_GOVERNOR=interactive

# --- GPU: naik satu tingkat bin (bin3 -> bin2) ---
# SOURCE VERIFIED dari qcom,gpu-pwrlevel-bins di sdm660-gpu.dtsi.
# qcom,gpu-pwrlevels-2 (speed-bin efuse 146) memiliki freq tertinggi 700MHz,
# satu tingkat di atas qcom,gpu-pwrlevels-3 (647MHz, dipakai unit stock kita).
GPU_OVERCLOCK=true
GPU_MAX_MHZ=700
GPU_FORCE_PWRLEVEL_BIN_EFUSE_RAW=146   # qcom,speed-bin raw value (pwrlevels-2, top 700MHz) -- was WRONG earlier, now corrected
GPU_BUS_FREQ_INDEX=11             # SOURCE VERIFIED: qcom,bus-freq pada pwrlevel@0 bin2

THERMAL_PROTECTION=enabled
THERMAL_BYPASS=false
VOLTAGE_MODIFICATION=false

# --- Hasil pengujian hardware nyata (dilaporkan pengguna, 2026-09-02) ---
HARDWARE_TESTED_RESULT=FAILED_RANDOM_REBOOT
HARDWARE_TESTED_NOTE="Random reboot pada unit fisik. Root cause belum pasti: electrical instability vs structural pwrlevel-count mismatch (7 vs 8/9 level). Lihat CHANGELOG.md."
