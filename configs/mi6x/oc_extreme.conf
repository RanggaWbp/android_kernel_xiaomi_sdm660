# =============================================================================
# configs/mi6x/oc_extreme.conf
# Status: SOURCE VERIFIED, CROSS-BIN GANDA (CPU + GPU ke bin0) — RISK: VERY HIGH
# NOT VERIFIED (belum ada bukti hardware test) untuk kombinasi penuh ini.
# =============================================================================

DEVICE=mi6x
CODENAME=wayne
SOC=SDM660
DEFCONFIG_BASE=arch/arm64/configs/wayne_defconfig
DTS_TARGET=arch/arm/boot/dts/qcom/sdm660-mtp-wayne.dts

PROFILE=oc_extreme
ARTIFACT_NAME=kernel-mi6x-extreme-oc
RISK_LEVEL=VERY-HIGH
REQUIRES_ACKNOWLEDGEMENT=true
HARDWARE_TESTED=false               # NOT VERIFIED -- jangan klaim stabil sebelum testing matrix (lihat item 14 brief)

# --- CPU: bin0 penuh (little + big) ---
CPU_OVERCLOCK=true
CPU_LITTLE_FORCE_SPEEDBIN=0         # SOURCE VERIFIED table, sama nilainya dgn bin1 (1843.2MHz) -- tidak ada gain nyata
CPU_LITTLE_MAX_MHZ=1843.2
CPU_BIG_FORCE_SPEEDBIN=0            # SOURCE VERIFIED table, HIGH RISK cross-bin (lihat oc_performance.conf)
CPU_BIG_MAX_MHZ=2457.6
CPU_BIG_VOLTAGE_CORNER=7
CPU_GOVERNOR=performance             # catatan: bukan "interactive" -- sustained load, bukan idle-friendly

# --- GPU: bin0 penuh (750MHz TURBO tier) ---
GPU_OVERCLOCK=true
GPU_MAX_MHZ=750
GPU_FORCE_PWRLEVEL_BIN_EFUSE_RAW=0     # qcom,speed-bin raw value (pwrlevels-0, top 750MHz)
GPU_BUS_FREQ_INDEX=13
GPU_MIN_BUS_FREQ_INDEX=12

THERMAL_PROTECTION=enabled           # WAJIB — extreme profile TIDAK BOLEH menonaktifkan ini
THERMAL_BYPASS=false
VOLTAGE_MODIFICATION=false

# CATATAN WAJIB DIBACA:
# - Little cluster force-bin0 TIDAK memberi gain apapun dibanding bin1/normal
#   (nilainya identik, 1843.2MHz) -- disertakan hanya demi konsistensi
#   struktur config, BUKAN karena ada headroom tambahan yang ditemukan.
# - Kombinasi CPU bin0 + GPU bin0 pada silikon yang sebenarnya di-fuse ke
#   bin lebih rendah adalah skenario paling berisiko di seluruh set profile
#   ini. Wajib lolos SELURUH testing matrix (item 14 prompt asli) sebelum
#   status boleh naik dari NOT VERIFIED ke HARDWARE TESTED.

# --- Hasil pengujian hardware nyata (dilaporkan pengguna, 2026-09-02) ---
HARDWARE_TESTED_RESULT=FAILED_RANDOM_REBOOT
HARDWARE_TESTED_NOTE="Random reboot pada unit fisik. Root cause belum pasti: electrical instability vs structural pwrlevel-count mismatch (7 vs 8/9 level). Lihat CHANGELOG.md."
