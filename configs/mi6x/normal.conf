# =============================================================================
# configs/mi6x/normal.conf
# Status: SOURCE VERIFIED
# =============================================================================

DEVICE=mi6x
CODENAME=wayne
SOC=SDM660
DEFCONFIG_BASE=arch/arm64/configs/wayne_defconfig
DTS_TARGET=arch/arm/boot/dts/qcom/sdm660-mtp-wayne.dts

include=../normal-build.conf

PROFILE=normal
ARTIFACT_NAME=kernel-mi6x-normal

# --- CPU (little / pwrcl, big / perfcl) ---
# Diambil apa adanya dari qcom,pwrcl-speedbinN-v0 / qcom,perfcl-speedbinN-v0
# di sdm660.dtsi. Speed-bin AKTUAL dipilih otomatis oleh silikon via efuse
# saat runtime — config ini TIDAK memaksa bin tertentu.
CPU_LITTLE_MAX_MHZ=stock         # SOURCE VERIFIED: hingga 1843.2 (bin0/1/4) atau 1612.8 (bin3)
CPU_BIG_MAX_MHZ=stock            # SOURCE VERIFIED: hingga 2208.0 (bin1) — cocok dgn unit uji (live monitor)
CPU_GOVERNOR=interactive         # SOURCE VERIFIED (governor default terlihat pada unit uji)

# --- GPU (Adreno 512) ---
GPU_MAX_MHZ=stock                # SOURCE VERIFIED: qcom,gpu-pwrlevel-bins, bin sesuai efuse GPU (unit uji = 647MHz)

# --- Voltage / Thermal ---
VOLTAGE_CORNER_TABLE=stock        # tidak diubah
THERMAL_PROTECTION=enabled
THERMAL_BYPASS=false
