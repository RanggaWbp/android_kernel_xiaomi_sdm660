# =============================================================================
# configs/mi6x/oc_performance.conf
# Status: SOURCE VERIFIED, CROSS-BIN (CPU big cluster + GPU) — RISK: HIGH
# =============================================================================

DEVICE=mi6x
CODENAME=wayne
SOC=SDM660
DEFCONFIG_BASE=arch/arm64/configs/wayne_defconfig
DTS_TARGET=arch/arm/boot/dts/qcom/sdm660-mtp-wayne.dts

PROFILE=oc_performance
ARTIFACT_NAME=kernel-mi6x-performance-oc
RISK_LEVEL=HIGH
REQUIRES_ACKNOWLEDGEMENT=true

# --- CPU big cluster (perfcl): force bin0 table ---
# SOURCE VERIFIED table content, HIGH RISK because it forces the
# best-binned silicon's LUT (bin0, up to 2457.6MHz) onto hardware whose
# efuse may report a lower bin. Requires patches/0001-clk-cpu-osm-*.patch.
CPU_OVERCLOCK=true
CPU_LITTLE_MAX_MHZ=stock            # little tetap: sudah max di semua bin>=0 kecuali bin3
CPU_BIG_MAX_MHZ=2457.6
CPU_BIG_FORCE_SPEEDBIN=0            # qcom,perfcl-force-speedbin = <0>; -- patch 0001 wajib
CPU_BIG_VOLTAGE_CORNER=7            # SOURCE VERIFIED: corner utk 2457600000 di qcom,perfcl-speedbin0-v0
CPU_GOVERNOR=interactive

# --- GPU: force bin1 table (700MHz sustained tier) ---
GPU_OVERCLOCK=true
GPU_MAX_MHZ=700
GPU_FORCE_PWRLEVEL_BIN_EFUSE_RAW=157   # qcom,speed-bin raw value (pwrlevels-1, top 750MHz but capping usage at 700MHz via GPU_MAX_MHZ)
GPU_BUS_FREQ_INDEX=11

THERMAL_PROTECTION=enabled           # WAJIB tetap aktif — tidak boleh dimatikan
THERMAL_BYPASS=false
VOLTAGE_MODIFICATION=false           # hanya memilih corner yang SUDAH ada di tabel, bukan menaikkan mV manual
