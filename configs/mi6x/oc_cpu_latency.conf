# =============================================================================
# configs/mi6x/oc_cpu_latency.conf
# Status: SOURCE VERIFIED + LATENCY BUILD
# TUJUAN: CPU big cross-bin (2.46GHz) + profil latency rendah (HZ_1000 +
# tunables scheduler diperkecil). Gantikan oc_cpu_only (profile lama dibuang).
# GPU tetap 100% stock -- tidak disentuh (terbukti gagal cross-bin, lihat
# oc_cpu_only.conf yang lama).
# =============================================================================

DEVICE=mi6x
CODENAME=wayne
SOC=SDM660
DEFCONFIG_BASE=arch/arm64/configs/wayne_latency_defconfig
DTS_TARGET=arch/arm/boot/dts/qcom/sdm660-mtp-wayne.dts

PROFILE=oc_cpu_latency
ARTIFACT_NAME=kernel-mi6x-cpu-latency-oc
RISK_LEVEL=HIGH
REQUIRES_ACKNOWLEDGEMENT=true
HARDWARE_TESTED_RESULT=NOT_YET_TESTED

# --- CPU big cluster (perfcl): force bin0 table (2.46GHz) ---
# Sama persis dengan oc_cpu_only yang lama -- butuh patch 0001.
CPU_OVERCLOCK=true
CPU_LITTLE_MAX_MHZ=stock
CPU_BIG_MAX_MHZ=2457.6
CPU_BIG_FORCE_SPEEDBIN=0
CPU_BIG_VOLTAGE_CORNER=7
CPU_GOVERNOR=interactive

# --- GPU: TIDAK DIUBAH ---
GPU_OVERCLOCK=false

# --- Latency build (compile-time) ---
# Defconfig wayne_latency_defconfig men-set CONFIG_HZ_1000 (tick 1ms, vs 3.33ms
# stock) + CONFIG_SCHED_LOW_LATENCY=y (halve sched_latency/min_granularity/
# wakeup_granularity di kernel/sched/fair.c). Hanya berlaku di build ini, bukan
# normal.
LATENCY_PROFILE=true
HZ=1000

THERMAL_PROTECTION=enabled
THERMAL_BYPASS=false
VOLTAGE_MODIFICATION=false
