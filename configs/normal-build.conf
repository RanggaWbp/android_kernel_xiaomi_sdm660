# =============================================================================
# normal-build.conf
# Baseline GLOBAL config — dipakai oleh SEMUA profile "normal" (mi6x & mia2).
# TIDAK BOLEH di-override oleh device/profile config manapun untuk field
# yang menyangkut safety (thermal_bypass, voltage_override, disable_protection).
#
# Status data: SOURCE VERIFIED
# Source: arch/arm/boot/dts/qcom/sdm660.dtsi ,
#         arch/arm/boot/dts/qcom/sdm660-gpu.dtsi
#         (repo: RanggaWbp/android_kernel_xiaomi_sdm660, branch master)
# =============================================================================

BUILD_TYPE=NORMAL
CPU_OVERCLOCK=false
GPU_OVERCLOCK=false
VOLTAGE_MODIFICATION=false
THERMAL_BYPASS=false
DISABLE_THERMAL_PROTECTION=false
UNSAFE_CLOCK_CHANGE=false

# Kernel harus pakai speed-bin table APA ADANYA sesuai efuse chip
# (dibaca runtime oleh driver qcom,clk-cpu-osm). Tidak ada override DT.
CPU_SPEEDBIN_OVERRIDE=none
GPU_SPEEDBIN_OVERRIDE=none

# Baseline ini dipakai untuk: pembanding stabilitas, debugging, benchmark
# baseline, fallback kernel. Lihat configs/mi6x/normal.conf dan
# configs/mia2/normal.conf untuk nilai device-specific (identik dgn ini,
# karena kedua device pakai sdm660.dtsi & sdm660-gpu.dtsi yang sama).
