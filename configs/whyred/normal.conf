# =============================================================================
# configs/whyred/normal.conf
# Status: TWEAK BACKPORT (from wayne_defconfig)
# =============================================================================

DEVICE=whyred
CODENAME=whyred
SOC=SDM660
DEFCONFIG_BASE=arch/arm64/configs/whyred_defconfig
DTS_TARGET=arch/arm/boot/dts/qcom/sdm636-mtp-whyred.dts

include=../normal-build.conf

PROFILE=normal
ARTIFACT_NAME=kernel-whyred-normal

# --- CPU (little / pwrcl, big / perfcl) ---
# Diambil apa adanya dari qcom,pwrcl-speedbinN-v0 / qcom,perfcl-speedbinN-v0
# di sdm660.dtsi. Speed-bin AKTUAL dipilih otomatis oleh silikon via efuse
# saat runtime — config ini TIDAK memaksa bin tertentu.
CPU_LITTLE_MAX_MHZ=stock
CPU_BIG_MAX_MHZ=stock
CPU_GOVERNOR=interactive

# --- GPU (Adreno 512) ---
GPU_MAX_MHZ=stock

# --- Voltage / Thermal ---
VOLTAGE_CORNER_TABLE=stock
THERMAL_PROTECTION=enabled
THERMAL_BYPASS=false
