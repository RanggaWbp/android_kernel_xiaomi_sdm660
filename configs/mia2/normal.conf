# =============================================================================
# configs/mia2/normal.conf
# Status: SOURCE VERIFIED
# =============================================================================

DEVICE=mia2
CODENAME=jasmine_sprout
SOC=SDM660
DEFCONFIG_BASE=arch/arm64/configs/jasmine-stock_defconfig
DTS_TARGET=arch/arm/boot/dts/qcom/sdm660-mtp-jasmine.dts

include=../normal-build.conf

PROFILE=normal
ARTIFACT_NAME=kernel-mia2-normal

# --- CPU (little / pwrcl, big / perfcl) ---
# jasmine_sprout include sdm660.dtsi yang SAMA dengan wayne -> tabel clock
# identik secara source. Nilai aktual tetap ditentukan efuse per-unit.
CPU_LITTLE_MAX_MHZ=stock         # SOURCE VERIFIED: identik dgn wayne (shared sdm660.dtsi)
CPU_BIG_MAX_MHZ=stock            # SOURCE VERIFIED: identik dgn wayne (shared sdm660.dtsi)
CPU_GOVERNOR=interactive

# --- GPU (Adreno 512) ---
GPU_MAX_MHZ=stock                # SOURCE VERIFIED: sdm660-gpu.dtsi sama dgn wayne

# --- Voltage / Thermal ---
VOLTAGE_CORNER_TABLE=stock
THERMAL_PROTECTION=enabled
THERMAL_BYPASS=false
