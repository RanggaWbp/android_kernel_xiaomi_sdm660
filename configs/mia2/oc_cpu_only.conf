# =============================================================================
# configs/mia2/oc_cpu_only.conf
# Status: SOURCE VERIFIED, CROSS-BIN (CPU big cluster SAJA) — RISK: HIGH
# TUJUAN: mengisolasi apakah CPU cross-bin stabil di unit ini, TERPISAH dari
# GPU (yang sudah TERBUKTI gagal di oc_balanced/oc_performance/oc_extreme).
# GPU di profile ini SENGAJA dibiarkan 100% stock -- tidak disentuh sama
# sekali -- supaya kalau ada reboot, kita tahu pasti penyebabnya CPU.
# =============================================================================

DEVICE=mia2
CODENAME=jasmine_sprout
SOC=SDM660
DEFCONFIG_BASE=arch/arm64/configs/jasmine-stock_defconfig
DTS_TARGET=arch/arm/boot/dts/qcom/sdm660-mtp-jasmine.dts

PROFILE=oc_cpu_only
ARTIFACT_NAME=kernel-mia2-cpu-only-oc
RISK_LEVEL=HIGH
REQUIRES_ACKNOWLEDGEMENT=true
HARDWARE_TESTED_RESULT=NOT_YET_TESTED

# --- CPU big cluster (perfcl): force bin0 table ---
# SOURCE VERIFIED table content (identik dgn oc_performance.conf), HIGH RISK
# karena memaksa LUT silikon best-binned (bin0, hingga 2457.6MHz) ke hardware
# yang efuse-nya mungkin melaporkan bin lebih rendah. Butuh patch 0001 saja
# (patch 0002/GPU TIDAK di-apply di profile ini).
CPU_OVERCLOCK=true
CPU_LITTLE_MAX_MHZ=stock            # tidak diubah -- sudah max di semua bin>=0 kecuali bin3
CPU_BIG_MAX_MHZ=2457.6
CPU_BIG_FORCE_SPEEDBIN=0            # qcom,perfcl-force-speedbin = <0>; -- patch 0001 wajib
CPU_BIG_VOLTAGE_CORNER=7            # SOURCE VERIFIED: corner utk 2457600000 di qcom,perfcl-speedbin0-v0
CPU_GOVERNOR=interactive

# --- GPU: TIDAK DIUBAH SAMA SEKALI ---
# Sengaja dikosongkan (tidak ada GPU_OVERCLOCK, GPU_FORCE_PWRLEVEL_BIN_EFUSE_RAW,
# dst) supaya patch 0002 tidak ter-apply dan qcom,speed-bin GPU tetap dibaca
# dari efuse asli unit (135, top 647MHz -- sudah terbukti stabil di normal.conf).
GPU_OVERCLOCK=false

THERMAL_PROTECTION=enabled           # WAJIB tetap aktif -- tidak boleh dimatikan
THERMAL_BYPASS=false
VOLTAGE_MODIFICATION=false           # hanya memilih corner yang SUDAH ada di tabel, bukan menaikkan mV manual

# --- CATATAN PENGUJIAN ---
# Kalau profile ini JUGA random reboot: berarti CPU cluster besar unit Anda
# juga tidak tahan di bin0 -- device Anda kemungkinan besar di-bin rendah
# di SEMUA domain (CPU dan GPU), bukan cuma GPU.
# Kalau profile ini STABIL: berarti CPU dan GPU domain di-bin terpisah pada
# unit Anda, dan CPU big cluster punya headroom OC yang valid meski GPU tidak.
# WAJIB lolos testing matrix penuh (lihat README.md) sebelum HARDWARE_TESTED_RESULT
# diubah dari NOT_YET_TESTED ke STABLE atau FAILED_*.
