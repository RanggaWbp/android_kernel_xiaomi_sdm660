name: Build & Release Kernel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allows manual trigger from the Actions tab too

jobs:
  build:
    name: Build ${{ matrix.device }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: wayne
            defconfig: wayne_defconfig
            display_name: "Mi 6X"
          - device: jasmine
            defconfig: jasmine-stock_defconfig
            display_name: "Mi A2"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 python3-pip zip curl git

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: eva-gcc-toolchain-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git toolchains/gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git toolchains/gcc32

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          make O=out ${{ matrix.defconfig }}
          make O=out -j$(nproc) 2>&1 | tee build.log

      - name: Verify build output
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "::error::Image.gz-dtb not found — build failed"
            tail -100 build.log
            exit 1
          fi
          ls -la out/arch/arm64/boot/Image.gz-dtb

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          rm -rf ramdisk patch tools/keycheck
          cp ../out/arch/arm64/boot/Image.gz-dtb .
          cat > anykernel.sh << EOF
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=ReSukiSU Kernel for ${{ matrix.device }} by RanggaWbp
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${{ matrix.device }}
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          boot_attributes() {
          set_perm_recursive 0 0 755 644 \$RAMDISK/*;
          set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          TAG_NAME="${GITHUB_REF_NAME}"
          ZIP_NAME="ReSukiSU-SUSFS-${{ matrix.device }}-${TAG_NAME}.zip"
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" ".github/*" "*.md"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-kernel
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-build-log
          path: build.log
          retention-days: 7

      - name: Save zip path for release job
        run: echo "${{ env.ZIP_NAME }}" >> zip-name.txt

      - name: Upload zip name
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-zip-name
          path: zip-name.txt

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-kernel"
          merge-multiple: true
          path: release-files

      - name: List downloaded files
        run: ls -la release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.zip
          name: "Kernel ${{ github.ref_name }}"
          body: |
            Automated build for tag `${{ github.ref_name }}`.

            Devices: wayne (Mi 6X), jasmine (Mi A2)

            See commit history for changelog.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
