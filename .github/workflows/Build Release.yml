name: Build & Release Kernel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allows manual trigger from the Actions tab too

permissions:
  contents: write # required so softprops/action-gh-release can create/update releases

jobs:
  build:
    name: Build ${{ matrix.device }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: wayne
            defconfig: wayne_defconfig
            display_name: "Mi 6X"
            model_prefix: "MI6X"
            device_name2: ""
            is_slot_device: "0"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # See build-kernel.yml: without --tags the submodule keeps no tags and
      # KernelSU/kernel/Kbuild falls back to its hardcoded "v4.1.0".
      - name: Unshallow KernelSU submodule and fetch its tags
        working-directory: KernelSU
        run: |
          git fetch --unshallow --tags
          tag="$(git describe --abbrev=0 --tags 2>/dev/null)" || {
            echo "::error::KernelSU has no tags -- KSU_TAG_NAME would fall back to the hardcoded v4.1.0"
            exit 1
          }
          echo "KernelSU version: ${tag}-$(git rev-parse --short=8 HEAD), $(git rev-list --count HEAD) commits"

      - name: Apply NoMount 4.4 compat patch
        run: bash scripts/apply_nomount_compat.sh NoMount

      # BakaSU suspends the SUSFS build with an unconditional $(error) in
      # kernel/tools/susfs_compat.mk, included by Kbuild whenever
      # CONFIG_KSU_SUSFS is set. Neutralise it here; submodule stays pristine.
      - name: Re-enable SUSFS in the KernelSU submodule
        run: bash scripts/apply_ksu_susfs_unsuspend.sh KernelSU

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 python3-pip zip curl git libdebuginfod1

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: eva-gcc-toolchain-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git toolchains/gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git toolchains/gcc32

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          make O=out ${{ matrix.defconfig }}
          # Same feature gate as build-kernel.yml: every backport must be
          # built in (=y), because the AnyKernel3 zip only ships
          # Image.gz-dtb -- a .ko would never reach the device.
          for sym in \
              CONFIG_NTSYNC=y \
              CONFIG_IOSCHED_ADIOS=y \
              CONFIG_LRU_GEN=y \
              CONFIG_LRU_GEN_ENABLED=y \
              CONFIG_TCP_CONG_BBR3=y \
              CONFIG_DEFAULT_BBR3=y ; do
            grep -q "^${sym%%=*}=" out/.config || echo "$sym" >> out/.config
          done
          make O=out olddefconfig
          make O=out -j$(nproc) 2>&1 | tee build.log

      - name: Verify build output
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "::error::Image.gz-dtb not found — build failed"
            tail -100 build.log
            exit 1
          fi
          ls -la out/arch/arm64/boot/Image.gz-dtb

          # .config alone is not proof: a symbol under a disabled parent
          # gate is dropped by olddefconfig and the build still goes green.
          fail=0
          for sym in CONFIG_NTSYNC CONFIG_NOMOUNT CONFIG_IOSCHED_ADIOS \
                     CONFIG_ANDROID_LOW_MEMORY_KILLER \
                     CONFIG_ANDROID_LOW_MEMORY_KILLER_AUTODETECT_OOM_ADJ_VALUES \
                     CONFIG_LRU_GEN CONFIG_TCP_CONG_BBR3 CONFIG_DEFAULT_BBR3 ; do
            if ! grep -q "^${sym}=y$" out/.config; then
              echo "::error::${sym}=y missing from out/.config"
              fail=1
            fi
          done
          for obj in drivers/misc/ntsync.o block/adios-iosched.o \
                     fs/nomount/nomount.o drivers/staging/android/lowmemorykiller.o \
                     net/ipv4/tcp_bbr3.o net/ipv4/tcp_plb.o ; do
            [ -f "out/$obj" ] || { echo "::error::out/$obj not built"; fail=1; }
          done
          grep -q "lru_gen_enabled" out/System.map || {
            echo "::error::MGLRU (lru_gen_enabled) not linked in"; fail=1; }
          grep -q "bbr3_init" out/System.map || {
            echo "::error::BBRv3 (bbr3_init) not linked in"; fail=1; }
          if [ "$fail" != 0 ]; then
            echo "::error::backported-feature validation failed"
            exit 1
          fi

      - name: Package AnyKernel3 zip
        run: |
          BUILD_DATE="$(date +'%d-%m-%Y')"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          rm -rf ramdisk patch tools/keycheck
          cp ../out/arch/arm64/boot/Image.gz-dtb .
          cat > anykernel.sh << EOF
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Custom Kernel for ${{ matrix.display_name }} (${{ matrix.device }}) | features: BakaSU + SUSFS + Re:Kernel + NoMount + BBG + EAS + BORE + ADIOS + NTSYNC + MGLRU + LMK + BBRv3 | by RanggaWbp | ${BUILD_DATE}
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${{ matrix.device }}
          device.name2=${{ matrix.device_name2 }}
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          boot_attributes() {
          set_perm_recursive 0 0 755 644 \$RAMDISK/*;
          set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=${{ matrix.is_slot_device }};
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          TAG_NAME="${GITHUB_REF_NAME}"
          ZIP_NAME="${{ matrix.model_prefix }}-BakaSU-SUSFS-${{ matrix.device }}-${TAG_NAME}-${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" ".github/*" "*.md"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-kernel
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-build-log
          path: build.log
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-kernel"
          merge-multiple: true
          path: release-files

      - name: List downloaded files
        run: ls -la release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.zip
          name: "Kernel ${{ github.ref_name }}"
          body: |
            # Custom Kernel — Mi 6X

            Linux 4.4 (Non-GKI) · ARM64 · tag `${{ github.ref_name }}`

            ## Features

            | Feature | Description |
            | :------ | :---------- |
            | **BakaSU** | Kernel-based root solution |
            | **SUSFS** | Root-hiding filesystem layer |
            | **Re:Kernel** | Kernel-level hardening |
            | **NoMount** | Mount namespace isolation |
            | **BBG** | Baseband guard, anti-format |
            | **EAS** | Energy-aware scheduling |
            | **BORE** | Burst-Oriented Response Enhancer scheduler |
            | **ADIOS** | Adaptive Deadline I/O scheduler (`adios`, CFQ tetap default) |
            | **NTSYNC** | NT sync primitives `/dev/ntsync` (Wine/Proton/emulator) |
            | **MGLRU** | Multi-Gen LRU page reclaim (MGLRU v5 backport) |
            | **LMK** | In-kernel low memory killer (`lowmemorykiller.c`, lmkd mode in-kernel) |
            | **BBRv3** | TCP congestion control `bbr3` (**aktif by default**) + PLB |

            ## Devices

            | Device | Codename | Slot |
            | :----- | :------- | :--- |
            | Xiaomi Mi 6X | `wayne` | A-only |

            ## Flash

            Flash the zip in TWRP. AnyKernel3 — no need to extract.

            ---

            See commit history for changelog.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
