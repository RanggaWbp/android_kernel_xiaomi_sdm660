name: Build OC Kernel (mi6x & mia2)

# Item #10 brief: 100% otomatis, tanpa proses manual di dalam workflow.
# Trigger (push/workflow_dispatch) hanya cara MEMULAI workflow -- begitu
# jalan, seluruh 8 kombinasi device x profile build tanpa approval/gate
# manual apapun (sesuai keputusan: "full otomatis semua profile").
#
# Update: output tidak lagi jadi Actions artifact biasa -- semua zip
# langsung diupload ke satu GitHub Release (prerelease) per run, dengan
# tag unik (tanggal + run_number) supaya run baru TIDAK menimpa release
# run sebelumnya. Zip AnyKernel3 sudah flash-ready (tidak perlu ekstrak),
# sha256/metadata/log dibuang dari output karena dianggap tidak penting.
on:
  push:
    branches: [ master ]
    paths:
      - "configs/**"
      - "patches/**"
      - "scripts/**"
      - ".github/workflows/build-kernel.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # perlu write untuk bikin/isi GitHub Release

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [mi6x, mia2]
        profile: [normal, oc_cpu_only]
        include:
          # device-specific constants -- dipakai buat AnyKernel3 properties()
          - device: mi6x
            codename: wayne
            display_name: "Mi 6X"
            defconfig: wayne_defconfig
            device_name2: ""
            is_slot_device: "0"
          - device: mia2
            codename: jasmine_sprout
            display_name: "Mi A2"
            defconfig: jasmine-stock_defconfig
            device_name2: "jasmine"
            is_slot_device: "1"
    env:
      CONF_FILE: configs/${{ matrix.device }}/${{ matrix.profile }}.conf
      # ARTIFACT_NAME TIDAK dihitung dari format string di sini (rawan bug --
      # sempat salah: "oc_balanced-oc" vs seharusnya "balanced-oc"). Diambil
      # langsung dari isi file conf di step "Validate OC config" di bawah,
      # supaya file conf tetap satu-satunya source of truth.

    steps:
      # ---------------------------------------------------------------
      # 0. Tanggal build -- dipakai buat nama zip DAN tag release, jadi
      #    setiap run punya tag unik (tgl + run_number) dan tidak saling
      #    menimpa release run lain.
      # ---------------------------------------------------------------
      - name: Set build date
        run: |
          echo "BUILD_DATE=$(date -u +'%d-%m-%Y')" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=oc-kernel-$(date -u +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 1. Checkout REPO CONFIG (configs/patches/scripts) -- repo ini
      # ---------------------------------------------------------------
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          path: oc-config
          fetch-depth: 1

      # ---------------------------------------------------------------
      # 2. STATIC VALIDATION -- item #12/#13 brief: FAIL BUILD kalau
      #    config tidak valid, sebelum satu baris kernel pun dicompile.
      # ---------------------------------------------------------------
      - name: Validate OC config (static safety check)
        working-directory: oc-config
        run: |
          chmod +x scripts/validate_oc_config.sh scripts/apply_oc_overrides.sh
          bash scripts/validate_oc_config.sh "${{ env.CONF_FILE }}"

      - name: Read ARTIFACT_NAME from conf (single source of truth)
        run: |
          NAME="$(grep -E '^ARTIFACT_NAME=' "oc-config/${{ env.CONF_FILE }}" | cut -d= -f2)"
          if [[ -z "$NAME" ]]; then
            echo "::error::ARTIFACT_NAME tidak ditemukan di ${{ env.CONF_FILE }}"
            exit 1
          fi
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 3. Checkout KERNEL SOURCE ke folder terpisah
      # ---------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: RanggaWbp/android_kernel_xiaomi_sdm660
          path: kernel
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 python3-pip zip curl git libdebuginfod1 \
            device-tree-compiler

      # ---------------------------------------------------------------
      # 4. Toolchain -- pola yg SUDAH TERBUKTI jalan di repo ini
      #    (.github/workflows/Build Release.yml yang sudah ada).
      # ---------------------------------------------------------------
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: eva-gcc-toolchain-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git toolchains/gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git toolchains/gcc32

      - name: Initialize KernelSU as a local git repo
        working-directory: kernel
        run: |
          # Wajib ada di source ini agar drivers/kernelsu/Kbuild lolos
          # sanity check versioning -- lihat workflow existing repo.
          cd KernelSU
          git init -q
          git add -A
          git -c user.email="ci@local" -c user.name="ci" commit -q -m "snapshot for build"

      # ---------------------------------------------------------------
      # 5. APPLY PATCH -- hanya untuk profile yang benar-benar butuh
      #    mekanisme override (dibaca dari isi conf, bukan hardcode
      #    per-profile, supaya conf tetap satu-satunya source of truth).
      # ---------------------------------------------------------------
      - name: Apply opt-in speedbin override patches (if required by profile)
        working-directory: kernel
        run: |
          set -a
          # shellcheck disable=SC1090
          source "../oc-config/${{ env.CONF_FILE }}"
          set +a

          if [[ -n "${CPU_LITTLE_FORCE_SPEEDBIN:-}" || -n "${CPU_BIG_FORCE_SPEEDBIN:-}" ]]; then
            echo "Profile butuh CPU force-speedbin -> apply patch 0001"
            git apply "../oc-config/patches/0001-clk-cpu-osm-add-opt-in-speedbin-override.patch"
          else
            echo "Profile tidak menyentuh CPU speedbin -> patch 0001 dilewati"
          fi

          # GPU speedbin override (patch 0002) DIHAPUS -- terbukti gagal (random
          # reboot / GPU hang) di hardware nyata pada semua profile yang memakainya
          # (oc_balanced, oc_performance, oc_extreme). Lihat CHANGELOG.md.

      # ---------------------------------------------------------------
      # 6. Suntik nilai override konkret ke DTS device target
      # ---------------------------------------------------------------
      - name: Apply DT overrides for this profile
        run: |
          bash oc-config/scripts/apply_oc_overrides.sh \
            "oc-config/${{ env.CONF_FILE }}" \
            "kernel"

      # ---------------------------------------------------------------
      # 7. BUILD
      # ---------------------------------------------------------------
      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          make O=out ${{ matrix.defconfig }}
          make O=out -j"$(nproc)" 2>&1 | tee build.log

      # ---------------------------------------------------------------
      # 8. AUTOMATIC VALIDATION -- item #12 brief: cek output benar2
      #    ada, ukuran wajar, log tidak mengandung fatal error.
      #    build.log HANYA dipakai buat validasi di sini, TIDAK diupload
      #    kemana pun (bukan bagian dari release).
      # ---------------------------------------------------------------
      - name: Verify build output
        working-directory: kernel
        run: |
          IMG="out/arch/arm64/boot/Image.gz-dtb"
          if [[ ! -f "$IMG" ]]; then
            echo "::error::$IMG tidak ditemukan -- build gagal"
            tail -150 build.log
            exit 1
          fi

          SIZE=$(stat -c%s "$IMG")
          echo "Image.gz-dtb size: ${SIZE} bytes"
          # Sanity range untuk kernel INI (msm-4.4 + KernelSU + SUSFS + banyak
          # driver tambahan). Batas awal 5-40MB TERBUKTI salah -- build 46.8MB
          # yang gagal karena batas ini ternyata build valid (lihat CHANGELOG).
          # Diperlebar ke 5-90MB agar tidak menolak build valid, tapi tetap
          # menangkap kasus benar-benar korup (mis. 0 byte atau file rusak).
          if (( SIZE < 5000000 || SIZE > 90000000 )); then
            echo "::error::Ukuran Image.gz-dtb tidak wajar (${SIZE} bytes) -- kemungkinan build korup"
            exit 1
          fi

          if grep -qiE "fatal error|undefined reference|multiple definition" build.log; then
            echo "::error::build.log mengandung fatal error -- lihat log lengkap"
            grep -inE "fatal error|undefined reference|multiple definition" build.log | head -30
            exit 1
          fi

          echo "Build output OK."

      # ---------------------------------------------------------------
      # 9. PACKAGE AnyKernel3 -- siap flash langsung, tanpa ekstrak.
      #    Tag ReSukiSU + SUSFS dicantumkan di kernel.string biar keliatan
      #    di recovery/flasher app.
      # ---------------------------------------------------------------
      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          rm -rf ramdisk patch tools/keycheck
          cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .

          RISK_LEVEL="$(grep -E '^RISK_LEVEL=' "../oc-config/${{ env.CONF_FILE }}" | cut -d= -f2 || true)"
          RISK_LEVEL="${RISK_LEVEL:-none}"

          cat > anykernel.sh << EOF
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Custom OC Kernel (${{ matrix.profile }}, risk=${RISK_LEVEL}) [ReSukiSU+SUSFS+Re-Kernel] for ${{ matrix.device }} by RanggaWbp - ${{ env.BUILD_DATE }}
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${{ matrix.codename }}
          device.name2=${{ matrix.device_name2 }}
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          boot_attributes() {
          set_perm_recursive 0 0 755 644 \$RAMDISK/*;
          set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=${{ matrix.is_slot_device }};
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          SHORT_SHA="$(cd ../kernel && git rev-parse --short HEAD)"
          # ARTIFACT_NAME tetap dari conf (single source of truth), tapi
          # setiap zip otomatis dapet suffix ReSukiSU-SUSFS -- kernel source
          # ini memang sudah support keduanya, jadi tidak perlu edit satu-satu
          # ARTIFACT_NAME= di 10 file conf.
          ZIP_NAME="${{ env.ARTIFACT_NAME }}-ReSukiSU-SUSFS-${SHORT_SHA}-${{ env.BUILD_DATE }}.zip"
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" ".github/*" "*.md"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 10. UPLOAD KE GITHUB RELEASE (prerelease) -- item #10/#11/#12
      #     brief digabung jadi satu langkah. Tag release unik per run
      #     (tanggal + run_number) supaya run baru tidak menimpa release
      #     run sebelumnya; 8 job matrix dalam run yang sama nge-append
      #     ke release yang sama (satu release berisi 8 zip flash-ready).
      # ---------------------------------------------------------------
      - name: Upload to prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "OC Kernel Build ${{ env.BUILD_DATE }} (run #${{ github.run_number }})"
          prerelease: true
          fail_on_unmatched_files: true
          files: ${{ env.ZIP_NAME }}
          body: |
            Custom OC Kernel untuk Mi 6X (wayne) & Mi A2 (jasmine_sprout).
            Fitur: **ReSukiSU + SUSFS + Re-Kernel** included.
            Build Date: ${{ env.BUILD_DATE }} (run #${{ github.run_number }}).
            Variant :
            normal - nothing changes
            CPU only - OC CPU 2.46 GHz

            Catatan: profile GPU OC (Balance/Performance/Extreme) sudah
            DIHAPUS -- terbukti random reboot (GPU hang) di hardware nyata.
            Hanya OC CPU yang terbukti stabil. Lihat CHANGELOG.md.
  env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
