name: Build OC Kernel (mi6x)

# Item #10 brief: 100% otomatis, tanpa proses manual di dalam workflow.
# Trigger (push/workflow_dispatch) hanya cara MEMULAI workflow -- begitu
# jalan, seluruh 8 kombinasi device x profile build tanpa approval/gate
# manual apapun (sesuai keputusan: "full otomatis semua profile").
#
# Update: output tidak lagi jadi Actions artifact biasa -- semua zip
# langsung diupload ke satu GitHub Release (prerelease) per run, dengan
# tag unik (tanggal + run_number) supaya run baru TIDAK menimpa release
# run sebelumnya. Zip AnyKernel3 sudah flash-ready (tidak perlu ekstrak),
# sha256/metadata/log dibuang dari output karena dianggap tidak penting.
on:
  push:
    branches: [ master ]
    paths:
      # Build inputs (profiles, patches, override scripts).
      - "configs/**"
      - "patches/**"
      - "scripts/apply_oc_overrides.sh"
      - "scripts/validate_oc_config.sh"
      # Kernel source that carries the BakaSU/SUSFS/Re:Kernel/BBG/NoMount
      # integration. Without these, a kernel fix (e.g. the su/stat redirect)
      # would never produce a new flashable release -- that is exactly why the
      # su fix had to be released manually via workflow_dispatch.
      - "fs/**"
      - "kernel/**"
      - "drivers/**"
      - "security/**"
      - "mm/**"
      - "ipc/**"
      - "net/**"
      - "include/**"
      - "arch/arm64/**"
      - "arch/arm/**"
      - "KernelSU"
      - "Baseband-guard/**"
      # The workflows themselves.
      - ".github/workflows/build-kernel.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # perlu write untuk bikin/isi GitHub Release

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [mi6x]
        profile: [normal, oc_cpu_only]
        include:
          # device-specific constants -- dipakai buat AnyKernel3 properties()
          # dan buat validasi appended-DTB.
          #
          # dtb_model/dtb_board_id: dipakai .github/scripts/verify_appended_dtb.py
          # untuk membuktikan image BENAR-BENAR membawa device tree device ini.
          #   wayne   : sdm660-mtp-wayne.dts   -> model "...MTP WAYNE", board-id <0x020008 0>
          - device: mi6x
            codename: wayne
            dtb_basename: sdm660-mtp-wayne
            dtb_model: "WAYNE"
            dtb_board_id: "131080 0"
            display_name: "Mi 6X"
            defconfig: wayne_defconfig
            device_name2: ""
            is_slot_device: "0"
    env:
      CONF_FILE: configs/${{ matrix.device }}/${{ matrix.profile }}.conf
      # ARTIFACT_NAME TIDAK dihitung dari format string di sini (rawan bug --
      # sempat salah: "oc_balanced-oc" vs seharusnya "balanced-oc"). Diambil
      # langsung dari isi file conf di step "Validate OC config" di bawah,
      # supaya file conf tetap satu-satunya source of truth.

    steps:
      # ---------------------------------------------------------------
      # 0. Tanggal build -- dipakai buat nama zip DAN tag release, jadi
      #    setiap run punya tag unik (tgl + run_number) dan tidak saling
      #    menimpa release run lain.
      # ---------------------------------------------------------------
      - name: Set build date
        run: |
          echo "BUILD_DATE=$(date -u +'%d-%m-%Y')" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=oc-kernel-$(date -u +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 1. Checkout REPO CONFIG (configs/patches/scripts) -- repo ini
      # ---------------------------------------------------------------
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          path: oc-config
          fetch-depth: 1

      # ---------------------------------------------------------------
      # 2. STATIC VALIDATION -- item #12/#13 brief: FAIL BUILD kalau
      #    config tidak valid, sebelum satu baris kernel pun dicompile.
      # ---------------------------------------------------------------
      - name: Validate OC config (static safety check)
        working-directory: oc-config
        run: |
          chmod +x scripts/validate_oc_config.sh scripts/apply_oc_overrides.sh
          bash scripts/validate_oc_config.sh "${{ env.CONF_FILE }}"

      - name: Read ARTIFACT_NAME from conf (single source of truth)
        run: |
          NAME="$(grep -E '^ARTIFACT_NAME=' "oc-config/${{ env.CONF_FILE }}" | cut -d= -f2)"
          if [[ -z "$NAME" ]]; then
            echo "::error::ARTIFACT_NAME tidak ditemukan di ${{ env.CONF_FILE }}"
            exit 1
          fi
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 3. Checkout KERNEL SOURCE ke folder terpisah
      # ---------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: RanggaWbp/android_kernel_xiaomi_sdm660
          path: kernel
          fetch-depth: 1
          submodules: recursive

      # actions/checkout clones submodules with fetch-depth 1 and no tags.
      # KernelSU/kernel/Kbuild then fails `git describe --abbrev=0 --tags`
      # and falls back to its hardcoded default, so the driver reports
      # "v4.1.0" regardless of the real commit; `git rev-list --count HEAD`
      # is 1, so KSU_VERSION comes out as a bogus 30701 instead of 35214.
      # --tags is required: --unshallow alone does not bring the tags in.
      - name: Unshallow KernelSU submodule and fetch its tags
        working-directory: kernel/KernelSU
        run: |
          git fetch --unshallow --tags
          tag="$(git describe --abbrev=0 --tags 2>/dev/null)" || {
            echo "::error::KernelSU has no tags -- KSU_TAG_NAME would fall back to the hardcoded v4.1.0"
            exit 1
          }
          echo "KernelSU version: ${tag}-$(git rev-parse --short=8 HEAD), $(git rev-list --count HEAD) commits"

      # NoMount tracks maxsteeel/nomount upstream and stays pristine. Upstream
      # targets modern kernels; this tree is 4.4, so apply the compat shim here.
      - name: Apply NoMount 4.4 compat patch
        working-directory: kernel
        run: bash scripts/apply_nomount_compat.sh NoMount

      # BakaSU upstream suspends the SUSFS build with an unconditional
      # $(error) in kernel/tools/susfs_compat.mk, which Kbuild includes
      # whenever CONFIG_KSU_SUSFS is set. Neutralise it at build time and
      # keep the submodule pristine, same as NoMount above.
      - name: Re-enable SUSFS in the KernelSU submodule
        working-directory: kernel
        run: bash scripts/apply_ksu_susfs_unsuspend.sh KernelSU

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 python3-pip zip curl git libdebuginfod1 \
            device-tree-compiler

      # ---------------------------------------------------------------
      # 4. Toolchain -- pola yg SUDAH TERBUKTI jalan di repo ini
      #    (.github/workflows/Build Release.yml yang sudah ada).
      # ---------------------------------------------------------------
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: eva-gcc-toolchain-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git toolchains/gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git toolchains/gcc32

      # ---------------------------------------------------------------
      # 5. APPLY PATCH -- hanya untuk profile yang benar-benar butuh
      #    mekanisme override (dibaca dari isi conf, bukan hardcode
      #    per-profile, supaya conf tetap satu-satunya source of truth).
      # ---------------------------------------------------------------
      - name: Apply opt-in speedbin override patches (if required by profile)
        working-directory: kernel
        run: |
          set -a
          # shellcheck disable=SC1090
          source "../oc-config/${{ env.CONF_FILE }}"
          set +a

          if [[ -n "${CPU_LITTLE_FORCE_SPEEDBIN:-}" || -n "${CPU_BIG_FORCE_SPEEDBIN:-}" ]]; then
            echo "Profile butuh CPU force-speedbin -> apply patch 0001"
            git apply "../oc-config/patches/0001-clk-cpu-osm-add-opt-in-speedbin-override.patch"
          else
            echo "Profile tidak menyentuh CPU speedbin -> patch 0001 dilewati"
          fi

          # GPU speedbin override (patch 0002) DIHAPUS -- terbukti gagal (random
          # reboot / GPU hang) di hardware nyata pada semua profile yang memakainya
          # (oc_balanced, oc_performance, oc_extreme).

      # ---------------------------------------------------------------
      # 6. Suntik nilai override konkret ke DTS device target
      # ---------------------------------------------------------------
      - name: Apply DT overrides for this profile
        run: |
          bash oc-config/scripts/apply_oc_overrides.sh \
            "oc-config/${{ env.CONF_FILE }}" \
            "kernel"

      # ---------------------------------------------------------------
      # 6b. EAS ENERGY MODEL GATE -- jalankan SEBELUM compile.
      #
      # kernel/sched/energy.c reads the DT property "sched-energy-costs"
      # (no vendor prefix). A CPU node carrying "qcom,sched-energy-costs"
      # is invisible: init_sched_energy_costs() bails on the first CPU,
      # no sge is allocated, update_cpu_capacity() leaves every CPU at
      # SCHED_CAPACITY_SCALE, and EAS silently runs on flat capacities.
      # The device log shows exactly that:
      #     sched-energy: CPU device node has no sched-energy-costs
      #     Invalid sched_group_energy for CPU0..7
      # The old verifier only parsed the four tables, never the reference
      # to them, so it passed while the model was dead code. Checks H and I
      # close that hole: H asserts the property name, I asserts every cap
      # equals round(cap_max * f / f_max).
      # ---------------------------------------------------------------
      - name: Verify EAS energy model (pre-build gate)
        run: |
          set -o pipefail
          python3 oc-config/.github/scripts/verify_eas_model.py \
            kernel/arch/arm/boot/dts/qcom/sdm660.dtsi 2>&1 | tee eas-model.log

      # ---------------------------------------------------------------
      # 7. BUILD
      # ---------------------------------------------------------------
      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          make O=out ${{ matrix.defconfig }}

          # ---------------------------------------------------------------
          # Force the backported features into .config.
          #
          # Everything added by this branch must be BUILT IN (=y), never =m:
          # the AnyKernel3 zip ships only Image.gz-dtb, so a .ko would never
          # reach the device and the feature would be invisible on boot.
          #
          # NTSYNC/ADIOS/BBR3 hide behind Kconfig symbols that a defconfig
          # does not necessarily carry (ADIOS and BBR3 sit inside a menu /
          # `if TCP_CONG_ADVANCED`), so append explicitly and let
          # olddefconfig resolve the dependencies.
          # ---------------------------------------------------------------
          for sym in \
              CONFIG_NTSYNC=y \
              CONFIG_IOSCHED_ADIOS=y \
              CONFIG_LRU_GEN=y \
              CONFIG_LRU_GEN_ENABLED=y \
              CONFIG_TCP_CONG_BBR3=y \
              CONFIG_DEFAULT_BBR3=y \
              CONFIG_SCHED_POC_SELECTOR=y \
              CONFIG_CPU_FREQ_GOV_REFLEX=y \
              CONFIG_CPU_FREQ_DEFAULT_GOV_REFLEX=y \
              CONFIG_DEFAULT_ADIOS=y ; do
            grep -q "^${sym%%=*}=" out/.config || echo "$sym" >> out/.config
          done
          make O=out olddefconfig

          # BBR3 is a choice entry: selecting DEFAULT_BBR3 is what makes it
          # the active algorithm. ADIOS is offered as a scheduler but CFQ
          # stays the boot default -- the user switches at runtime.
          make O=out -j"$(nproc)" 2>&1 | tee build.log

      # ---------------------------------------------------------------
      # 7b. CAPTURE BAKASU VERSION -- otomatis dari build, bukan hardcode.
      #     Kbuild mencetaknya saat compile:
      #       -- BakaSU version code: 35229
      #       -- BakaSU version name: v4.2.0-rc3-d7260ca1-dirty
      #       -- Supported Managers: KernelSU Official, KOWSU, BakaSU
      #     Ditulis ke file + diupload sebagai artifact agar job release
      #     (job lain) bisa membacanya. Gagal keras kalau tidak ketemu,
      #     supaya release tidak pernah terbit tanpa versi.
      # ---------------------------------------------------------------
      - name: Capture BakaSU version (automatic)
        working-directory: kernel
        run: |
          CODE="$(sed -n 's/.*-- BakaSU version code: \([0-9][0-9]*\).*/\1/p' build.log | head -1)"
          NAME="$(sed -n 's/.*-- BakaSU version name: \([^[:space:]]*\).*/\1/p' build.log | head -1)"
          MGRS="$(sed -n 's/.*-- Supported Managers:[[:space:]]*\(.*\)/\1/p' build.log | head -1 | sed 's/[[:space:]]*$//')"
          if [[ -z "$CODE" || -z "$NAME" ]]; then
            echo "::error::versi BakaSU tidak ketemu di build.log -- Kbuild tidak mencetaknya?"
            grep -inE "BakaSU version|Supported Managers" build.log | head -10 || true
            exit 1
          fi
          if [[ -z "$MGRS" ]]; then
            echo "::warning::Supported Managers tidak ketemu di build.log -- lanjut tanpa daftar manager"
          fi
          echo "BakaSU version code: ${CODE}"
          echo "BakaSU version name: ${NAME}"
          echo "Supported Managers: ${MGRS:-unknown}"
          OUTFILE="ksu-version-${{ matrix.device }}-${{ matrix.profile }}.env"
          {
            echo "KSU_VERSION_CODE=${CODE}"
            echo "KSU_VERSION_NAME=${NAME}"
            echo "KSU_MANAGERS=${MGRS:-unknown}"
          } > "$OUTFILE"
          echo "wrote $OUTFILE"

      # ---------------------------------------------------------------
      # 8. AUTOMATIC VALIDATION -- item #12 brief: cek output benar2
      #    ada, ukuran wajar, log tidak mengandung fatal error.
      #    build.log HANYA dipakai buat validasi di sini, TIDAK diupload
      #    kemana pun (bukan bagian dari release).
      # ---------------------------------------------------------------
      - name: Verify build output
        working-directory: kernel
        run: |
          IMG="out/arch/arm64/boot/Image.gz-dtb"
          if [[ ! -f "$IMG" ]]; then
            echo "::error::$IMG tidak ditemukan -- build gagal"
            tail -150 build.log
            exit 1
          fi

          SIZE=$(stat -c%s "$IMG")
          echo "Image.gz-dtb size: ${SIZE} bytes"
          # Sanity range untuk kernel INI (msm-4.4 + KernelSU + SUSFS + banyak
          # driver tambahan). Batas awal 5-40MB TERBUKTI salah -- build 46.8MB
          # yang gagal karena batas ini ternyata build valid.
          # Diperlebar ke 5-90MB agar tidak menolak build valid, tapi tetap
          # menangkap kasus benar-benar korup (mis. 0 byte atau file rusak).
          if (( SIZE < 5000000 || SIZE > 90000000 )); then
            echo "::error::Ukuran Image.gz-dtb tidak wajar (${SIZE} bytes) -- kemungkinan build korup"
            exit 1
          fi

          if grep -qiE "fatal error|undefined reference|multiple definition" build.log; then
            echo "::error::build.log mengandung fatal error -- lihat log lengkap"
            grep -inE "fatal error|undefined reference|multiple definition" build.log | head -30
            exit 1
          fi

          # ---------------------------------------------------------------
          # 8a-bis. BACKPORTED-FEATURE GATE.
          #
          # Setting a symbol in .config is not proof the code compiled: a
          # symbol whose parent gate is off (TCP_CONG_BBR3 lives inside
          # `if TCP_CONG_ADVANCED`) is silently dropped by olddefconfig and
          # the build still goes green. So check the resolved .config AND
          # the object files, which is the only real evidence.
          # ---------------------------------------------------------------
          check_symbol() {
            local sym="$1" want="$2" got
            got="$(sed -n "s/^${sym}=//p" out/.config | tail -1)"
            if [[ "$got" != "$want" ]]; then
              echo "::error::${sym} = '${got}', expected '${want}' (fitur hilang dari build)"
              return 1
            fi
            echo "  ok ${sym}=${got}"
          }
          fail=0
          check_symbol CONFIG_NTSYNC y        || fail=1
          check_symbol CONFIG_NOMOUNT y       || fail=1
          check_symbol CONFIG_IOSCHED_ADIOS y || fail=1
          check_symbol CONFIG_LRU_GEN y       || fail=1
          check_symbol CONFIG_TCP_CONG_BBR3 y || fail=1
          check_symbol CONFIG_DEFAULT_BBR3 y  || fail=1
          check_symbol CONFIG_SCHED_POC_SELECTOR y || fail=1
          check_symbol CONFIG_CPU_FREQ_GOV_REFLEX y || fail=1
          check_symbol CONFIG_CPU_FREQ_DEFAULT_GOV_REFLEX y || fail=1
          check_symbol CONFIG_DEFAULT_ADIOS y || fail=1
          # LMK kernel driver wajib ada di target build (wayne).
          # lmkd mendeteksi /sys/module/lowmemorykiller/parameters/minfree lalu
          # memakai in-kernel interface, jadi driver ini yang membunuh.
          check_symbol CONFIG_ANDROID_LOW_MEMORY_KILLER y || fail=1
          check_symbol CONFIG_ANDROID_LOW_MEMORY_KILLER_AUTODETECT_OOM_ADJ_VALUES y || fail=1
          check_symbol CONFIG_MEMCG y          || fail=1
          check_symbol CONFIG_MEMCG_SWAP y     || fail=1

          # Object files: proves the code was really compiled in, not just
          # selected in Kconfig.
          for obj in drivers/misc/ntsync.o block/adios-iosched.o \
                     fs/nomount/nomount.o drivers/staging/android/lowmemorykiller.o \
                     mm/vmscan.o net/ipv4/tcp_bbr3.o net/ipv4/tcp_plb.o \
                     kernel/sched/poc_selector.o drivers/cpufreq/cpufreq_reflex.o ; do
            if [[ ! -f "out/$obj" ]]; then
              echo "::error::out/$obj tidak ada -- fitur backport tidak ter-compile"
              fail=1
            fi
          done

          # MGLRU is not a separate object: it replaces the reclaim path, so
          # the only evidence is the symbol in vmlinux.
          if ! grep -q "lru_gen_enabled" out/System.map 2>/dev/null; then
            echo "::error::lru_gen_enabled tidak ada di System.map -- MGLRU tidak masuk"
            fail=1
          fi
          # LZ4 was re-synced to the kernel's own copy of the library
          # (torvalds/linux master lib/lz4), which renamed every entry point
          # (LZ4_compress_default, LZ4_decompress_safe, LZ4_compress_HC).
          # The old LG-era names are gone, so a consumer left on the old API
          # would still link against nothing here.
          for sym in LZ4_compress_default LZ4_decompress_safe \
                     LZ4_compress_HC LZ4_decompress_fast ; do
            if ! grep -q " ${sym}$" out/System.map 2>/dev/null; then
              echo "::error::${sym} tidak ada di System.map -- lz4 upstream tidak masuk"
              fail=1
            fi
          done
          # BBRv3 registers as "bbr3"; the ops struct must be linked in.
          if ! grep -q "bbr3_init\|tcp_plb_update_state" out/System.map 2>/dev/null; then
            echo "::error::bbr3_init/tcp_plb_update_state tidak ada di System.map"
            fail=1
          fi
          # POC-Selector fast idle CPU picker must be linked into vmlinux.
          if ! grep -q "sched_poc_select_cpu" out/System.map 2>/dev/null; then
            echo "::error::sched_poc_select_cpu tidak ada di System.map -- POC selector tidak masuk"
            fail=1
          fi
          if (( fail )); then
            echo "::error::validasi fitur backport gagal"
            exit 1
          fi

          echo "Build output OK."

      # ---------------------------------------------------------------
      # 8b. APPENDED DTB VALIDATION -- membuktikan image benar-benar
      #     membawa device tree untuk device ini, dan (khusus profile OC)
      #     override speedbin benar-benar tertanam di DTB.
      #
      #     Image.gz-dtb = gzip(Image) + SEMUA .dtb hasil build. Kalau
      #     defconfig kehilangan simbol board (CONFIG_MACH_XIAOMI_WAYNE),
      #     Makefile dts jatuh ke daftar board generik Qualcomm dan image
      #     berisi DTB generik saja -- build tetap "sukses" dan zip tetap
      #     terbit, tapi device memakai device tree yang salah dan override
      #     OC tidak pernah ikut. Itu yang terjadi pada jasmine-stock.
      # ---------------------------------------------------------------
      - name: Verify appended DTB matches this device
        working-directory: kernel
        env:
          EXPECT_MODEL: ${{ matrix.dtb_model }}
          EXPECT_BOARD_ID: ${{ matrix.dtb_board_id }}
          PROFILE: ${{ matrix.profile }}
        run: |
          IMG="out/arch/arm64/boot/Image.gz-dtb"
          SCRIPT="../oc-config/.github/scripts/verify_appended_dtb.py"
          ARGS=()

          # Model is only asserted when it is actually unique for the device
          # (jasmine's model string is identical to the generic SDM660 MTP,
          # so its identity is asserted through board-id instead).
          if [[ -n "$EXPECT_MODEL" ]]; then
            ARGS+=(--expect-model "$EXPECT_MODEL")
          fi
          ARGS+=(--expect-board-id "$EXPECT_BOARD_ID")

          # OC profiles must carry the speedbin override inside the DTB. This is
          # the only place that can prove an "oc" zip actually overclocks:
          # apply_oc_overrides.sh writes qcom,perfcl-force-speedbin=<0> into the
          # board DTS, and configs/*/oc_cpu_only.conf sets
          # CPU_BIG_FORCE_SPEEDBIN=0 (bin0 tops out at 2457.6 MHz).
          if [[ "$PROFILE" == "oc_cpu_only" ]]; then
            ARGS+=(--expect-prop "qcom,perfcl-force-speedbin=0")
          fi

          ARGS+=(--expect-dtb "${{ matrix.dtb_basename }}.dtb")
          python3 "$SCRIPT" "$IMG" "${ARGS[@]}"
          echo "Appended DTB OK: image carries ${{ matrix.dtb_basename }}.dtb"

      # ---------------------------------------------------------------
      # 9. PACKAGE AnyKernel3 -- siap flash langsung, tanpa ekstrak.
      #    Tag BakaSU + SUSFS dicantumkan di kernel.string biar keliatan
      #    di recovery/flasher app. kernel.string juga memuat versi persis
      #    BakaSU *yang benar-benar ter-build di job ini* (dari step
      #    7b "Capture BakaSU version"), jadi TWRP/KernelFlasher selalu
      #    menampilkan versi yang sesuai tanpa edit manual.
      # ---------------------------------------------------------------
      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          rm -rf ramdisk patch tools/keycheck
          cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .

          RISK_LEVEL="$(grep -E '^RISK_LEVEL=' "../oc-config/${{ env.CONF_FILE }}" | cut -d= -f2 || true)"
          RISK_LEVEL="${RISK_LEVEL:-none}"

          KSU_TAG="$(sed -n 's/.*-- BakaSU version name: \([^[:space:]]*\).*/\1/p' ../kernel/build.log | head -1)"
          KSU_CODE="$(sed -n 's/.*-- BakaSU version code: \([0-9][0-9]*\).*/\1/p' ../kernel/build.log | head -1)"
          if [[ -z "$KSU_TAG" || -z "$KSU_CODE" ]]; then
            echo "::error::versi BakaSU tidak ketemu di kernel/build.log"
            exit 1
          fi

          cat > anykernel.sh << EOF
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Custom OC Kernel for ${{ matrix.display_name }} (${{ matrix.codename }}) | profile: ${{ matrix.profile }} (risk: ${RISK_LEVEL}) | features: BakaSU ${KSU_TAG} (code ${KSU_CODE}) + SUSFS + Re:Kernel + NoMount + BBG + EAS + BORE + POC-Selector + REFLEX + ADIOS + NTSYNC + MGLRU + LMK + BBRv3 + LZ4 + DroidSpaces | by RanggaWbp | ${{ env.BUILD_DATE }}
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${{ matrix.codename }}
          device.name2=${{ matrix.device_name2 }}
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          boot_attributes() {
          set_perm_recursive 0 0 755 644 \$RAMDISK/*;
          set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=${{ matrix.is_slot_device }};
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          ui_print " ";
          ui_print "================================================";
          ui_print "   RanggaWbp OC Kernel  -  Xiaomi Mi 6X (wayne)";
          ui_print "   profile: ${{ matrix.profile }}    risk: ${RISK_LEVEL}";
          ui_print "   build  : ${{ env.BUILD_DATE }}";
          ui_print "================================================";
          ui_print " ";
          ui_print " Features enabled:";
          ui_print "   [x] BakaSU ${KSU_TAG} + SUSFS + Re:Kernel + NoMount";
          ui_print "   [x] EAS + BORE scheduler";
          ui_print "   [x] POC-Selector  (fast idle CPU pick)";
          ui_print "   [x] Reflex cpufreq governor (default)";
          ui_print "   [x] ADIOS I/O scheduler (default)";
          ui_print "   [x] MGLRU + LMK + NTSYNC + BBRv3 + LZ4";
          ui_print " ";
          ui_print " - Unpacking boot image ...";
          dump_boot;
          ui_print " - Flashing kernel ...";
          write_boot;
          ui_print " - Done. Reboot and enjoy!";
          EOF

          SHORT_SHA="$(cd ../kernel && git rev-parse --short HEAD)"
          # ARTIFACT_NAME tetap dari conf (single source of truth), tapi
          # setiap zip otomatis dapet suffix BakaSU-SUSFS -- kernel source
          # ini memang sudah support keduanya, jadi tidak perlu edit satu-satu
          # ARTIFACT_NAME= di 10 file conf.
          ZIP_NAME="${{ env.ARTIFACT_NAME }}-BakaSU-SUSFS-${SHORT_SHA}-${{ env.BUILD_DATE }}.zip"
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" ".github/*" "*.md"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 10. UPLOAD ZIP sebagai Actions artifact (BUKAN langsung ke release).
      #
      #     RACE CONDITION yang diperbaiki di sini: sebelumnya setiap job
      #     matrix memanggil softprops/action-gh-release pada tag yang sama
      #     secara PARALEL. Empat job berebut membuat/menimpa release yang
      #     sama, dan zip yang selesai lebih dulu ikut terhapus. Terbukti pada
      #     run #67: log job mi6x/normal menulis "✅ Uploaded
      #     kernel-mi6x-normal-...zip", tetapi release akhirnya hanya berisi
      #     3 dari 4 zip -- kernel-mi6x-normal hilang, padahal job-nya hijau.
      #
      #     Sekarang tiap job hanya mengunggah artifact, dan job "release"
      #     (needs: build) membuat release SEKALI setelah semua build selesai.
      # ---------------------------------------------------------------
      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.device }}-${{ matrix.profile }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      # File versi BakaSU (satu per matrix job). Job release mengambil
      # salah satunya -- semuanya identik karena satu repo + satu commit.
      - name: Upload BakaSU version file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksu-version-${{ matrix.device }}-${{ matrix.profile }}
          path: kernel/ksu-version-${{ matrix.device }}-${{ matrix.profile }}.env
          retention-days: 30

  # ==========================================================================
  # JOB release -- mengumpulkan SEMUA zip lalu membuat satu release.
  # Dipisah dari job build supaya tidak ada penulisan paralel ke release.
  # ==========================================================================
  release:
    name: Publish release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Compute release tag
        run: |
          echo "BUILD_DATE=$(date -u +'%d-%m-%Y')" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=oc-kernel-$(date -u +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Download all zip artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: zips

      # Ambil file versi BakaSU dari salah satu job build (semuanya
      # identik -- satu repo, satu commit). Gagal keras kalau tidak ada,
      # supaya release tidak pernah terbit tanpa versi.
      - name: Download BakaSU version file
        uses: actions/download-artifact@v4
        with:
          pattern: ksu-version-*
          merge-multiple: true
          path: ksuver

      - name: Read BakaSU version (automatic)
        run: |
          ls -la ksuver
          SRC="$(ls -1 ksuver/ksu-version-*.env | head -1)"
          echo "reading ${SRC}"
          KSU_VERSION_CODE="$(sed -n 's/^KSU_VERSION_CODE=//p' "$SRC" | head -1)"
          KSU_VERSION_NAME="$(sed -n 's/^KSU_VERSION_NAME=//p' "$SRC" | head -1)"
          KSU_MANAGERS="$(sed -n 's/^KSU_MANAGERS=//p' "$SRC" | head -1)"
          if [[ -z "$KSU_VERSION_CODE" || -z "$KSU_VERSION_NAME" ]]; then
            echo "::error::file versi BakaSU kosong/rusak: ${SRC}"
            cat "$SRC" || true
            exit 1
          fi
          echo "BakaSU version code: ${KSU_VERSION_CODE}"
          echo "BakaSU version name: ${KSU_VERSION_NAME}"
          echo "Supported Managers: ${KSU_MANAGERS}"
          {
            echo "KSU_VERSION_CODE=${KSU_VERSION_CODE}"
            echo "KSU_VERSION_NAME=${KSU_VERSION_NAME}"
            echo "KSU_MANAGERS=${KSU_MANAGERS}"
          } >> "$GITHUB_ENV"

      - name: List collected zips
        run: |
          ls -la zips
          COUNT=$(ls -1 zips/*.zip 2>/dev/null | wc -l)
          echo "collected ${COUNT} zip(s)"
          # 2 = 1 device x 2 profile. Gagal keras kalau ada yang hilang, supaya
          # release tidak pernah terbit dengan zip tidak lengkap.
          if [ "$COUNT" -ne 2 ]; then
            echo "::error::expected 2 zips (mi6x x normal/oc_cpu_only), got ${COUNT}"
            exit 1
          fi

      - name: Verify every expected zip is present
        run: |
          rc=0
          for want in kernel-mi6x-normal kernel-mi6x-cpu-only-oc; do
            if ls zips/${want}-*.zip >/dev/null 2>&1; then
              echo "OK   ${want}"
            else
              echo "::error::missing ${want}*.zip"
              rc=1
            fi
          done
          exit $rc

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "OC Kernel Build ${{ env.BUILD_DATE }} (run #${{ github.run_number }})"
          prerelease: true
          fail_on_unmatched_files: true
          files: zips/*.zip
          body: |
            # Custom OC Kernel — Mi 6X

            Linux 4.4 (Non-GKI) · ARM64 · commits [`${{ github.sha }}`](https://github.com/RanggaWbp/android_kernel_xiaomi_sdm660/commit/${{ github.sha }})

            ## Features

            | Feature | Description |
            | :------ | :---------- |
            | **BakaSU** | Kernel-based root solution — **${{ env.KSU_VERSION_NAME }}** (code `${{ env.KSU_VERSION_CODE }}`), managers: ${{ env.KSU_MANAGERS }} |
            | **SUSFS** | Root-hiding filesystem layer |
            | **Re:Kernel** | Kernel-level hardening |
            | **NoMount** | Mount namespace isolation |
            | **BBG** | Baseband guard, anti-format |
            | **EAS** | Energy-aware scheduling |
            | **DroidSpaces** | LXC/Docker container support (namespaces, cgroups, IPv4/IPv6 NAT) |
            | **BORE** | Burst-Oriented Response Enhancer scheduler |
            | **ADIOS** | Adaptive Deadline I/O scheduler (`adios`, CFQ tetap default) |
            | **NTSYNC** | NT sync primitives `/dev/ntsync` (Wine/Proton/emulator) |
            | **MGLRU** | Multi-Gen LRU page reclaim (MGLRU v5 backport) |
            | **LMK** | In-kernel low memory killer (`drivers/staging/android/lowmemorykiller.c`, lmkd mode in-kernel: `/sys/module/lowmemorykiller/parameters/minfree`) |
            | **BBRv3** | TCP congestion control `bbr3` (**enabled by default**, alongside `bbr` v1) + PLB |
            | **LZ4** | `lib/lz4` re-synced to the Linux kernel's own copy (`torvalds/linux` master, LZ4 v1.8.x base — the kernel does not track lz4/lz4 v1.9+): `lib/lz4` + crypto `lz4`/`lz4hc` + squashfs LZ4 + initramfs/initrd LZ4 |

            ## Devices

            | Device | Codename | Slot |
            | :----- | :------- | :--- |
            | Xiaomi Mi 6X | `wayne` | A-only |

            ## Variants

            | Profile | CPU big cluster | Risk |
            | :------ | :-------------- | :--- |
            | `normal` | stock (efuse speed-bin) | none |
            | `cpu-only-oc` | 2.46 GHz (forced speed-bin 0) | HIGH |

            > The OC profile forces the best-binned LUT onto silicon that may be
            > binned lower. Keep a boot backup ready.

            ## Flash

            Flash the zip in TWRP. AnyKernel3 — no need to extract.

            ---

            **Build** ${{ env.BUILD_DATE }} · run #${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
