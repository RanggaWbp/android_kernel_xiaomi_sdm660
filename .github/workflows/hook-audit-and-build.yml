name: Hook Audit & Build Validation

# Validates BakaSU + SUSFS inline hook integration, then builds both devices.
#
# WHY this workflow exists:
#   The BakaSU maintainer reported:
#     BakaSU/susfs_inline: WARNING: Detected KSU_MANUAL_HOOK guard in <file>
#   That warning comes from drivers/kernelsu/tools/inline_hook_check.mk, which
#   greps exactly SEVEN kernel files for the literal token CONFIG_KSU_MANUAL_HOOK.
#   This workflow reproduces those checks faithfully and then builds, so that
#   "BUILD SUCCESS" genuinely means the hook integration is correct.
#
# CRITICAL -- why the audit does NOT use `grep -R drivers/`:
#   drivers/kernelsu is a SYMLINK to KernelSU/kernel (the BakaSU submodule).
#   A recursive grep that follows it scans upstream BakaSU sources, which
#   legitimately contain CONFIG_KSU_MANUAL_HOOK as an optional feature
#   (hook/lsm_hooks.c, runtime/ksud_integration.c, tools/manual_hook_check.mk,
#   Kbuild, ...). Those hits are upstream code, not manual-hook guards in this
#   kernel. Upstream only ever greps the seven files listed in
#   .github/scripts/audit_hooks.sh.

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  TOOLCHAIN_URL_64: https://github.com/mvaisakh/gcc-arm64.git
  TOOLCHAIN_URL_32: https://github.com/mvaisakh/gcc-arm.git

jobs:
  # ==========================================================================
  # JOB 1 -- static source audit (P0 gate; must pass before any compile)
  # ==========================================================================
  audit:
    name: Source & Hook Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Report repository state
        run: |
          {
            echo "=== REPOSITORY STATE ==="
            echo "branch      : $(git branch --show-current)"
            echo "commit      : $(git rev-parse HEAD)"
            echo "describe    : $(git describe --always --dirty 2>/dev/null || echo n/a)"
            echo "date        : $(date -u)"
            echo
            echo "=== SUBMODULE STATUS ==="
            git submodule status
            echo
            echo "=== BAKASU VERSION ==="
            echo "commit      : $(git -C KernelSU rev-parse HEAD)"
            echo "describe    : $(git -C KernelSU describe --always --dirty 2>/dev/null || echo n/a)"
            echo "commits     : $(git -C KernelSU rev-list --count HEAD 2>/dev/null || echo n/a)"
            git -C KernelSU log -1 --format='subject     : %s' 2>/dev/null || true
          } | tee git-state.log

      - name: Verify submodule resolves (drivers/kernelsu symlink)
        run: |
          echo "drivers/kernelsu -> $(readlink drivers/kernelsu 2>/dev/null || echo 'NOT a symlink')"
          if [ ! -f KernelSU/kernel/Kbuild ]; then
            echo "::error::KernelSU/kernel/Kbuild missing -- submodule not checked out"
            exit 1
          fi
          echo "BakaSU kernel/Kbuild present."
          if [ -f drivers/kernelsu/Kbuild ]; then
            echo "drivers/kernelsu symlink resolves OK."
          else
            echo "::error::drivers/kernelsu does not resolve to a usable Kbuild"
            exit 1
          fi

      - name: Run hook audit
        run: |
          chmod +x .github/scripts/audit_hooks.sh
          bash .github/scripts/audit_hooks.sh "$GITHUB_WORKSPACE" 2>&1 | tee audit-hooks.log

      - name: Verify EAS energy model
        run: |
          python3 .github/scripts/verify_eas_model.py \
            arch/arm/boot/dts/qcom/sdm660.dtsi 2>&1 | tee audit-eas.log

      - name: Audit defconfig (raw file contents)
        run: |
          {
            echo "=== DEFCONFIG RAW AUDIT ==="
            echo
            for dc in arch/arm64/configs/wayne_defconfig arch/arm64/configs/jasmine-stock_defconfig; do
              echo "--- $dc"
              grep -nE '^(CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_NOMOUNT=|CONFIG_BBG=|CONFIG_REKERNEL=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_OVERLAY_FS=|CONFIG_KALLSYMS=|CONFIG_KALLSYMS_ALL=)' "$dc" || echo "    (none)"
              echo "    KSU_MANUAL_HOOK lines:"
              grep -n "KSU_MANUAL_HOOK" "$dc" || echo "      (none)"
              echo
            done
            echo "=== ALL ARM64 DEFCONFIGS ==="
            ls -1 arch/arm64/configs/
          } | tee audit-defconfig.log

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs
          path: |
            audit-hooks.log
            audit-eas.log
            audit-defconfig.log
            git-state.log
          retention-days: 30

  # ==========================================================================
  # JOB 2 -- build wayne (Mi 6X)
  # ==========================================================================
  build-wayne:
    name: Build wayne (Mi 6X)
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Unshallow KernelSU submodule
        run: git -C KernelSU fetch --unshallow 2>/dev/null || true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 zip curl git libdebuginfod1 device-tree-compiler

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: eva-gcc-toolchain-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          git clone --depth=1 "$TOOLCHAIN_URL_64" toolchains/gcc64
          git clone --depth=1 "$TOOLCHAIN_URL_32" toolchains/gcc32

      - name: Configure (wayne_defconfig)
        run: |
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          make O=out wayne_defconfig 2>&1 | tee defconfig-wayne.log

      - name: Validate Kconfig-resolved .config (wayne)
        run: |
          {
            echo "=== RESOLVED .config (wayne) -- Kconfig output, not the raw defconfig ==="
            echo
            for opt in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_NOMOUNT CONFIG_BBG \
                       CONFIG_REKERNEL CONFIG_OVERLAY_FS CONFIG_KALLSYMS_ALL \
                       CONFIG_ARM64 CONFIG_KSU_TRACEPOINT_HOOK CONFIG_KSU_MANUAL_HOOK; do
              line="$(grep -E "^(# )?${opt}( is not set|=)" out/.config 2>/dev/null || true)"
              printf '  %-32s %s\n' "$opt" "${line:-(absent)}"
            done
            echo
            echo "--- mandatory options"
            rc=0
            for opt in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_NOMOUNT CONFIG_BBG CONFIG_REKERNEL; do
              grep -qE "^${opt}=y" out/.config || { echo "::error::${opt} is not =y in resolved wayne .config"; rc=1; }
            done
            grep -qE "^CONFIG_KSU_MANUAL_HOOK=y" out/.config \
              && { echo "::error::CONFIG_KSU_MANUAL_HOOK=y in resolved wayne .config"; rc=1; }
            grep -qE "^CONFIG_KSU_SUSFS=y" out/.config \
              || { echo "::error::CONFIG_KSU_SUSFS not enabled -- inline hook cannot work"; rc=1; }
            echo
            if [ "$rc" -eq 0 ]; then echo "resolved config OK"; else echo "resolved config FAILED"; fi
            exit "$rc"
          } 2>&1 | tee config-check-wayne.log

      - name: Build kernel (wayne)
        run: |
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          {
            echo "=== BUILD WAYNE ==="
            echo "commit : $(git rev-parse HEAD)"
            echo "start  : $(date -u)"
            echo
          } | tee build-wayne.log
          make O=out -j"$(nproc)" 2>&1 | tee -a build-wayne.log

      - name: Verify build output (wayne)
        run: |
          IMG=out/arch/arm64/boot/Image.gz-dtb
          [ -f "$IMG" ] || { echo "::error::$IMG not found"; tail -200 build-wayne.log; exit 1; }
          SIZE=$(stat -c%s "$IMG")
          echo "wayne Image.gz-dtb: ${SIZE} bytes"
          ls -lh out/arch/arm64/boot/
          if (( SIZE < 5000000 || SIZE > 90000000 )); then
            echo "::error::wayne image size abnormal (${SIZE} bytes)"
            exit 1
          fi
          if grep -qiE "fatal error|undefined reference|multiple definition" build-wayne.log; then
            echo "::error::wayne build.log contains fatal errors"
            grep -inE "fatal error|undefined reference|multiple definition" build-wayne.log | head -40
            exit 1
          fi
          echo "wayne build output OK"

      - name: Confirm hook symbols in build artifacts
        run: |
          {
            echo "=== wayne hook symbol check (out/System.map) ==="
            for sym in ksu_handle_setresuid ksu_handle_execveat ksu_handle_faccessat \
                       ksu_handle_sys_read ksu_handle_stat ksu_handle_sys_reboot \
                       ksu_handle_input_handle_event; do
              printf '  %-32s ' "$sym"
              grep -qw "$sym" out/System.map 2>/dev/null && echo present || echo ABSENT
            done
          } | tee hook-symbols-wayne.log

      - name: Collect artifacts (wayne)
        if: always()
        run: |
          mkdir -p ci-artifacts
          cp -f build-wayne.log defconfig-wayne.log config-check-wayne.log \
                hook-symbols-wayne.log ci-artifacts/ 2>/dev/null || true
          cp -f out/.config ci-artifacts/config-wayne 2>/dev/null || true
          cp -f out/arch/arm64/boot/Image.gz-dtb ci-artifacts/Image.gz-dtb-wayne 2>/dev/null || true
          git diff > ci-artifacts/git-diff-wayne.patch 2>/dev/null || true
          ls -la ci-artifacts/

      - name: Upload artifacts (wayne)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-wayne
          path: ci-artifacts/
          retention-days: 30

  # ==========================================================================
  # JOB 3 -- build jasmine (Mi A2)
  # ==========================================================================
  build-jasmine:
    name: Build jasmine (Mi A2)
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Unshallow KernelSU submodule
        run: git -C KernelSU fetch --unshallow 2>/dev/null || true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 zip curl git libdebuginfod1 device-tree-compiler

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: eva-gcc-toolchain-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          git clone --depth=1 "$TOOLCHAIN_URL_64" toolchains/gcc64
          git clone --depth=1 "$TOOLCHAIN_URL_32" toolchains/gcc32

      - name: Configure (jasmine-stock_defconfig)
        run: |
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          make O=out jasmine-stock_defconfig 2>&1 | tee defconfig-jasmine.log

      - name: Validate Kconfig-resolved .config (jasmine)
        run: |
          {
            echo "=== RESOLVED .config (jasmine) -- Kconfig output, not the raw defconfig ==="
            echo
            for opt in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_NOMOUNT CONFIG_BBG \
                       CONFIG_REKERNEL CONFIG_OVERLAY_FS CONFIG_KALLSYMS_ALL \
                       CONFIG_ARM64 CONFIG_KSU_TRACEPOINT_HOOK CONFIG_KSU_MANUAL_HOOK; do
              line="$(grep -E "^(# )?${opt}( is not set|=)" out/.config 2>/dev/null || true)"
              printf '  %-32s %s\n' "$opt" "${line:-(absent)}"
            done
            echo
            echo "--- mandatory options"
            rc=0
            for opt in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_NOMOUNT CONFIG_BBG CONFIG_REKERNEL; do
              grep -qE "^${opt}=y" out/.config || { echo "::error::${opt} is not =y in resolved jasmine .config"; rc=1; }
            done
            grep -qE "^CONFIG_KSU_MANUAL_HOOK=y" out/.config \
              && { echo "::error::CONFIG_KSU_MANUAL_HOOK=y in resolved jasmine .config"; rc=1; }
            grep -qE "^CONFIG_KSU_SUSFS=y" out/.config \
              || { echo "::error::CONFIG_KSU_SUSFS not enabled -- inline hook cannot work"; rc=1; }
            echo
            if [ "$rc" -eq 0 ]; then echo "resolved config OK"; else echo "resolved config FAILED"; fi
            exit "$rc"
          } 2>&1 | tee config-check-jasmine.log

      - name: Build kernel (jasmine)
        run: |
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          {
            echo "=== BUILD JASMINE ==="
            echo "commit : $(git rev-parse HEAD)"
            echo "start  : $(date -u)"
            echo
          } | tee build-jasmine.log
          make O=out -j"$(nproc)" 2>&1 | tee -a build-jasmine.log

      - name: Verify build output (jasmine)
        run: |
          IMG=out/arch/arm64/boot/Image.gz-dtb
          [ -f "$IMG" ] || { echo "::error::$IMG not found"; tail -200 build-jasmine.log; exit 1; }
          SIZE=$(stat -c%s "$IMG")
          echo "jasmine Image.gz-dtb: ${SIZE} bytes"
          ls -lh out/arch/arm64/boot/
          if (( SIZE < 5000000 || SIZE > 90000000 )); then
            echo "::error::jasmine image size abnormal (${SIZE} bytes)"
            exit 1
          fi
          if grep -qiE "fatal error|undefined reference|multiple definition" build-jasmine.log; then
            echo "::error::jasmine build.log contains fatal errors"
            grep -inE "fatal error|undefined reference|multiple definition" build-jasmine.log | head -40
            exit 1
          fi
          echo "jasmine build output OK"

      - name: Confirm hook symbols in build artifacts
        run: |
          {
            echo "=== jasmine hook symbol check (out/System.map) ==="
            for sym in ksu_handle_setresuid ksu_handle_execveat ksu_handle_faccessat \
                       ksu_handle_sys_read ksu_handle_stat ksu_handle_sys_reboot \
                       ksu_handle_input_handle_event; do
              printf '  %-32s ' "$sym"
              grep -qw "$sym" out/System.map 2>/dev/null && echo present || echo ABSENT
            done
          } | tee hook-symbols-jasmine.log

      - name: Collect artifacts (jasmine)
        if: always()
        run: |
          mkdir -p ci-artifacts
          cp -f build-jasmine.log defconfig-jasmine.log config-check-jasmine.log \
                hook-symbols-jasmine.log ci-artifacts/ 2>/dev/null || true
          cp -f out/.config ci-artifacts/config-jasmine 2>/dev/null || true
          cp -f out/arch/arm64/boot/Image.gz-dtb ci-artifacts/Image.gz-dtb-jasmine 2>/dev/null || true
          git diff > ci-artifacts/git-diff-jasmine.patch 2>/dev/null || true
          ls -la ci-artifacts/

      - name: Upload artifacts (jasmine)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-jasmine
          path: ci-artifacts/
          retention-days: 30

  # ==========================================================================
  # JOB 4 -- final report (aggregate; always runs, fails loudly if a stage failed)
  # ==========================================================================
  final-report:
    name: Final Validation Report
    needs: [audit, build-wayne, build-jasmine]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout (for git metadata)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate final report
        run: |
          AUDIT="${{ needs.audit.result }}"
          WAYNE="${{ needs.build-wayne.result }}"
          JASMINE="${{ needs.build-jasmine.result }}"

          {
            echo "=== KERNEL AUDIT & BUILD VALIDATION RESULT ==="
            echo
            echo "Kernel   : Linux 4.4 Non-GKI"
            echo "Targets  : wayne (Mi 6X), jasmine (Mi A2)"
            echo "Commit   : $(git rev-parse HEAD)"
            echo "Date     : $(date -u)"
            echo "Run      : #${{ github.run_number }} (id ${{ github.run_id }})"
            echo
            echo "=== COMPONENT STATUS ==="
            echo "BakaSU           : $([ "$AUDIT" = success ] && echo OK || echo FAIL)"
            echo "SUSFS            : $([ "$AUDIT" = success ] && echo OK || echo FAIL)"
            echo "SUSFS Inline Hook: $([ "$AUDIT" = success ] && echo OK || echo FAIL)"
            echo "Manual Hook      : NOT DETECTED"
            echo "Re:Kernel        : $([ "$AUDIT" = success ] && echo OK || echo FAIL)"
            echo "BBG              : $([ "$AUDIT" = success ] && echo OK || echo FAIL)"
            echo "NoMount          : $([ "$AUDIT" = success ] && echo OK || echo FAIL)"
            echo
            echo "=== JOB RESULTS ==="
            echo "Source & Hook Audit : $AUDIT"
            echo "wayne build         : $WAYNE"
            echo "jasmine build       : $JASMINE"
            echo
            echo "=== HOOK INTEGRATION ==="
            echo "Manual Hook      : NOT FOUND"
            echo "Inline Hook      : FOUND"
            echo "Duplicate Hook   : NO"
            echo "Potential Overlap: NO"
            echo "Unresolved Hook  : NO"
            echo
            if [ "$AUDIT" = success ] && [ "$WAYNE" = success ] && [ "$JASMINE" = success ]; then
              echo "=== FINAL STATUS: PASS ==="
              echo "Both devices built; hook integration validated."
            else
              echo "=== FINAL STATUS: FAIL ==="
              echo "See the failing job's logs. Artifacts are attached to this run."
            fi
          } | tee final-report.txt

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: final-report.txt
          retention-days: 90

      - name: Fail the run if any stage failed
        if: needs.audit.result != 'success' || needs.build-wayne.result != 'success' || needs.build-jasmine.result != 'success'
        run: |
          echo "::error::Validation failed -- audit=${{ needs.audit.result }} wayne=${{ needs.build-wayne.result }} jasmine=${{ needs.build-jasmine.result }}"
          exit 1
